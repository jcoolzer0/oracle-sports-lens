name: Record pregame forecasts and publish
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forecast-journal
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/record-forecasts.mjs
      - name: Commit append-only journal and evidence
        run: |
          git config user.name 'oracle-forecast-bot'
          git config user.email 'oracle-forecast-bot@users.noreply.github.com'
          git add data/forecast-journal.json data/forecast-snapshots data/market-reference.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record timestamped pregame forecasts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare static site without Git metadata
        run: |
          mkdir /tmp/oracle-site
          git archive HEAD | tar -x -C /tmp/oracle-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/oracle-site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo 'Pages artifact metadata is still unavailable after upload.' >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
